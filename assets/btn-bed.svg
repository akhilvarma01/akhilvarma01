<svg xmlns="http://www.w3.org/2000/svg" width="175" height="38" viewBox="0 0 175 38" role="img" aria-label="go back to bed">
<style>
  text { font-family: ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace; }
  .pulse { animation: p 2.6s ease-in-out infinite; }
  @keyframes p { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
</style>
<rect x="1" y="1" width="173" height="36" rx="7" fill="#161b22" stroke="#2d333b"/>
<text x="17" y="24" font-size="13.5" fill="#484f58" class="pulse">▸</text>
<text x="34" y="24" font-size="13.5" fill="#484f58">go back to bed</text>
</svg>
