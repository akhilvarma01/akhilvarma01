</style>
<rect x="1" y="1" width="190" height="36" rx="7" fill="#161b22" stroke="#1f4f55"/>
<text x="17" y="24" font-size="13.5" fill="#39d0d8" class="pulse">▸</text>
<text x="34" y="24" font-size="13.5" fill="#39d0d8">kubectl rollback</text>
</svg>
