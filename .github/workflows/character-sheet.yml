name: character-sheet

on:
  schedule:
    - cron: '0 3 * * *'      # 03:00 UTC nightly
  workflow_dispatch:          # lets you trigger a run by hand

# Only the write access needed to commit the regenerated sheet.
permissions:
  contents: write

concurrency:
  group: character-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Pinned to an immutable commit, not the mutable v4 tag. A tag can be
      # repointed; this job holds STATS_TOKEN and contents:write, so a
      # compromised action would run with both.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22

      # read:user token. Cannot list repos, read source, or clone.
      - name: Fetch contribution counts
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: node scripts/fetch-stats.mjs

      - name: Render the sheet
        run: node scripts/character.mjs

      - name: Commit only if a number changed
        run: |
          git config user.name  'character-sheet bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.json assets/character.svg
          if git diff --staged --quiet; then
            echo 'no change — nothing to commit'
          else
            git commit -m 'chore: nightly character sheet'
            git push
          fi
